function init(){[...new Set(D.map(x=>x.category))].forEach(x=>cat.add(new Option(x,x)));[...new Set(D.map(x=>x.base))].forEach(x=>base.add(new Option(x,x)));q.oninput=cat.onchange=base.onchange=()=>{page=1;render()};render()}
function filt(){let s=q.value.toLowerCase();return D.filter(d=>(!s||(d.title+' '+d.category+' '+d.objective).toLowerCase().includes(s))&&(!cat.value||d.category===cat.value)&&(!base.value||d.base===base.value))}
function render(){let L=filt(),pages=Math.max(1,Math.ceil(L.length/PAGE));if(page>pages)page=pages;let items=L.slice((page-1)*PAGE,page*PAGE);grid.innerHTML=items.map(d=>`<div class="card" onclick="openD('${d.id}')"><div class="thumb">${svg(d,true)}</div><div class="info"><div class="muted">${d.id} • ${d.category}</div><h3>${d.title}</h3><div class="muted">${d.objective}</div><div class="chips"><span class="chip">${d.width}×${d.height} yd</span><span class="chip">${d.format}</span><span class="chip">${d.version}</span></div></div></div>`).join('');pager.innerHTML=`<button class="alt" ${page<=1?'disabled':''} onclick="page--;render()">←</button><span class="chip">Page ${page} / ${pages} • ${L.length} drills</span><button class="alt" ${page>=pages?'disabled':''} onclick="page++;render()">→</button>`}
function svg(d,small){
 const l=d.layout,W=720,H=450,x0=60,y0=50,x1=680,y1=395;
 const X=x=>x0+(x/100)*(x1-x0), Y=y=>y0+(y/100)*(y1-y0), marker='m'+d.id;
 let out=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%"><defs><marker id="${marker}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#fff"/></marker></defs>
 <rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="#176b3a" stroke="#fff" stroke-width="3"/>
 <line x1="${x0}" y1="30" x2="${x1}" y2="30" stroke="#fff" stroke-width="2"/><line x1="${x0}" y1="22" x2="${x0}" y2="38" stroke="#fff"/><line x1="${x1}" y1="22" x2="${x1}" y2="38" stroke="#fff"/><text x="${(x0+x1)/2}" y="21" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">${d.width} yd</text>
 <line x1="38" y1="${y0}" x2="38" y2="${y1}" stroke="#fff" stroke-width="2"/><line x1="30" y1="${y0}" x2="46" y2="${y0}" stroke="#fff"/><line x1="30" y1="${y1}" x2="46" y2="${y1}" stroke="#fff"/><text x="19" y="${(y0+y1)/2}" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" transform="rotate(-90 19 ${(y0+y1)/2})">${d.height} yd</text>`;
 l.zones.forEach(z=>{out+=`<g><rect x="${X(z[0])}" y="${Y(z[1])}" width="${(z[2]/100)*(x1-x0)}" height="${(z[3]/100)*(y1-y0)}" fill="rgba(255,255,255,.04)" stroke="#ffd75a" stroke-width="2" stroke-dasharray="7 5"/><text x="${X(z[0]+z[2]/2)}" y="${Y(z[1])+15}" text-anchor="middle" fill="#ffd75a" font-size="11" font-weight="700">${z[4]}</text></g>`});
 l.goals.forEach(g=>{if(g[0]=='left')out+=`<rect x="${x0-12}" y="${Y(g[1])}" width="12" height="${(g[2]/100)*(y1-y0)}" fill="none" stroke="#fff" stroke-width="4"/>`;else if(g[0]=='right')out+=`<rect x="${x1}" y="${Y(g[1])}" width="12" height="${(g[2]/100)*(y1-y0)}" fill="none" stroke="#fff" stroke-width="4"/>`;else if(g[0]=='top')out+=`<rect x="${X(g[1])}" y="${y0-10}" width="${(g[2]/100)*(x1-x0)}" height="10" fill="none" stroke="#fff" stroke-width="3"/>`;else out+=`<rect x="${X(g[1])}" y="${y1}" width="${(g[2]/100)*(x1-x0)}" height="10" fill="none" stroke="#fff" stroke-width="3"/>`});
 l.arrows.forEach(a=>{let col=a[4]=='press'?'#ffec7a':a[4]=='recovery'||a[4]=='transition'?'#ff9f43':'#fff';let dash=a[4]=='carry'?'10 6':'0';out+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(a[2])}" y2="${Y(a[3])}" stroke="${col}" stroke-width="4" stroke-dasharray="${dash}" marker-end="url(#${marker})"/>`});
 function dot(arr,c,txt){arr.forEach(p=>{out+=`<g><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="15" fill="${c}" stroke="#fff" stroke-width="3"/><text x="${X(p[0])}" y="${Y(p[1])+4}" text-anchor="middle" fill="${txt}" font-size="9" font-weight="800">${p[2]}</text></g>`})} dot(l.blue,'#42a5f5','#fff');dot(l.red,'#ef5350','#fff');dot(l.yellow,'#ffd54f','#111');
 l.balls.forEach(b=>{out+=`<circle cx="${X(b[0])+13}" cy="${Y(b[1])+8}" r="6" fill="#fff" stroke="#111" stroke-width="2"/>`});
 return out+'</svg>'}
